secrets:
  cloudpi_secrets:
    file: /run/secrets-tmp/cloudpi.secrets

services:
  db:
    image: cloudpi1/cloudpi:Cloudpi_db_v1.1.074
    container_name: cloudpi-db
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    networks:
      - cloudpi-network
    secrets:
      - cloudpi_secrets
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 90s

    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G

  clickhouse:
    # The analytics database. Its image comes from the same build as the db image: Cloudpi_db_<x> -> Cloudpi_ch_<x>.
    # cp_upgrade.sh moves CH_IMAGE_TAG with every upgrade; an install without this service gets it from
    # clickhouse-setup.sh (see README-CLICKHOUSE.md).
    image: cloudpi1/cloudpi:${CH_IMAGE_TAG:-Cloudpi_ch_v1.1.074}
    container_name: cloudpi-clickhouse
    restart: always
    networks:
      - cloudpi-network
    secrets:
      - cloudpi_secrets
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - clickhouse_tls:/etc/clickhouse-tls
      - clickhouse_ca:/etc/clickhouse-ca
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # ClickHouse sizes its memory, threads and caches from these limits at every start.
    deploy:
      resources:
        limits:
          cpus: '${CH_CPUS:-2}'
          memory: ${CH_MEMORY:-4G}

  app:
    image: cloudpi1/cloudpi:Cloudpi_v1.1.074
    container_name: cloudpi-app
    hostname: cloudpi-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    secrets:
      - cloudpi_secrets
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/CPiP/v1/health && curl -f http://localhost/CPiN/monitor"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "443:443" # HTTPS
      - "80:80" # HTTP
      # Redis stays on this host unless .env sets REDIS_PUBLISH_IP, which only the optional Pico add-on needs
      # (README-PICO.md).
      - "${REDIS_PUBLISH_IP:-127.0.0.1}:6379:6379"
    networks:
      - cloudpi-network
    env_file:
      - .env
    environment:
      HOST: ${HOST:-localhost}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      # Both services write their single JSON log here so host rsyslog can tail
      # /var/log/pico/*.log (spec 116). Flask reads this already; Node now honors
      # LOGS_BASE_DIR too (src/utils/logger.ts + frontendLogger.ts).
      LOGS_BASE_DIR: /var/log/pico
      # Frozen PyInstaller Flask: its OpenSSL looks for CAs at a build-time path
      # that doesn't exist in the container, so Databricks (and any HTTPS) calls
      # fail with CERTIFICATE_VERIFY_FAILED. Point it at the image's CA bundle.
      # (tracker/2026-07-09/databricks-ssl-frozen-openssl-trust-store)
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      # Where saves and reads go: both databases, with ClickHouse answering reads, unless .env says otherwise.
      # DB_WRITE=mysql and DB_READ=mysql run the app on MySQL alone, as before ClickHouse (README-CLICKHOUSE.md).
      DB_WRITE: ${DB_WRITE:-dual}
      DB_READ: ${DB_READ:-clickhouse}
      CH_HOST: cloudpi-clickhouse
      CH_PORT: "8443"
      CH_SECURE: "true"
      # The private CA the clickhouse container creates; only the app's ClickHouse clients trust it.
      # CH_USER and CH_PASSWORD come from cloudpi.secrets.
      CH_CA_CERT: /etc/clickhouse-ca/ca.crt
    volumes:
      - redis_data:/var/lib/redis
      - ./certs:/home/certs
      - cloudpi:/app/backups
      - clickhouse_ca:/etc/clickhouse-ca:ro
      # Expose the JSON log dir to the host so the pre-installed rsyslog can tail it.
      # MUST be an absolute /var/log path: rsyslog's AppArmor profile only allows
      # reads under /var/log/** (NOT /root or /home), so a relative ./logs/pico
      # (which resolves under the bundle dir, e.g. /root/...) would be unreadable
      # by rsyslog. Pre-create on the host so the app (UID 1000) can WRITE and the
      # host `syslog` user can READ:
      #   mkdir -p /var/log/pico && chown -R 1000:syslog /var/log/pico && chmod 2750 /var/log/pico
      - /var/log/pico:/var/log/pico
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  cloudpi:
    driver: local
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
  clickhouse_tls:
    driver: local
  clickhouse_ca:
    driver: local

networks:
  cloudpi-network:
    driver: bridge
    # SECURITY: Enable network isolation
    internal: false  # Set to true if no external access needed
    ipam:
      config:
        - subnet: 172.28.0.0/16
