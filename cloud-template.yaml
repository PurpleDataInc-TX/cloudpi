AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template for launching a CloudPi AMI with dynamic
  subdomain naming.


Parameters:
  # Required Parameters (no defaults)
  AMIID:
    Type: String
    Default: ''
    Description: REQUIRED - AMI ID for EC2 instance

  InstanceType:
    Type: String
    Default: ''
    Description: REQUIRED - EC2 instance type

  KeyName:
    Type: String
    Default: ''
    Description: REQUIRED - EC2 key pair name

  HTTPSEnabled:
    Type: String
    AllowedValues: ['True', 'False']
    Description: REQUIRED - Enable HTTPS/subdomain (true/false)

  # Optional Parameters (empty defaults)
  HostedZoneId:
    Type: String
    Default: ''
    Description: OPTIONAL - Route53 Hosted Zone ID (required if HTTPS=true)

  DomainName:
    Type: String
    Default: ''
    Description: OPTIONAL - Base domain name (required if HTTPS=true)

  EnableLambdaIngestion:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: OPTIONAL - 'true' prepares this stack for setup-lambda.sh (Lambda ingestion in your own AWS account, see the cloudpi README) - gives the server an IAM role, lets its containers reach it, and creates the security group the function runs in. 'false' changes nothing.

Conditions:
  CreateSubdomain: !And 
    - !Equals [!Ref HTTPSEnabled, 'true']
    - !Not [!Equals [!Ref HostedZoneId, '']]
    - !Not [!Equals [!Ref DomainName, '']]

  LambdaEnabled: !Equals [!Ref EnableLambdaIngestion, 'true']

Resources:

  # VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: CloudPiVPC

  # Subnet 1 (Public)
  Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

  # Subnet 2 (Public)
  Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: CloudPiInternetGateway

  # Attach Internet Gateway to VPC
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Route Table
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: CloudPiRouteTable

  # Route to Internet (0.0.0.0/0)
  Route:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Subnet 1 Route Table Association
  Subnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1
      RouteTableId: !Ref RouteTable

  # Subnet 2 Route Table Association
  Subnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet2
      RouteTableId: !Ref RouteTable

  # Security Group for EC2 Instance
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH, HTTP, HTTPS, MySQL, Apache Superset, Flask
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0 # Open to all IPs (consider restricting to your IP)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0 # Open to all IPs (consider restricting to your MySQL server IP)
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5001
          ToPort: 5001
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 587
          ToPort: 587
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5005
          ToPort: 5005
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8088
          ToPort: 8088
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: 0.0.0.0/0

  # ---- Lambda ingestion (only when EnableLambdaIngestion is 'true'; see setup-lambda.sh) ----------------------------------------------------
  # The security group the Lambda function runs in: no inbound rules. It may reach the CloudPi database below, and nothing else is opened.
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: LambdaEnabled
    Properties:
      GroupDescription: CloudPi Lambda ingestion function (no inbound rules)
      VpcId: !Ref VPC

  # MySQL from the function only. (InstanceSecurityGroup above still opens 3306 to 0.0.0.0/0: restrict that rule to your own addresses.)
  MySqlFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: LambdaEnabled
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: CloudPi Lambda ingestion function to MySQL

  # The server's AWS identity. It starts with no permissions: setup-lambda.sh --instance-role attaches the one policy CloudPi needs.
  InstanceRole:
    Type: AWS::IAM::Role
    Condition: LambdaEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: LambdaEnabled
    Properties:
      Roles:
        - !Ref InstanceRole

  # Elastic IP Allocation
  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref EC2Instance

  SubdomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateSubdomain
    Properties:
      HostedZoneId: !If [CreateSubdomain, !Ref HostedZoneId, !Ref 'AWS::NoValue']
      Name: !If 
        - CreateSubdomain
        - !Sub "client${EC2Instance.PublicIp}.${DomainName}"
        - !Ref 'AWS::NoValue'
      Type: A
      TTL: '300'
      ResourceRecords:
        - !GetAtt ElasticIP.PublicIp

  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: AttachGateway
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: !Ref AMIID
      IamInstanceProfile: !If [LambdaEnabled, !Ref InstanceProfile, !Ref 'AWS::NoValue']
      # Containers sit one network hop behind the instance, and the default hop limit of 1 hides the instance role from them.
      MetadataOptions: !If
        - LambdaEnabled
        - HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        - !Ref 'AWS::NoValue'
      NetworkInterfaces:
        - AssociatePublicIpAddress: 'true'
          DeviceIndex: 0
          SubnetId: !Ref Subnet1
          GroupSet:
            - !Ref InstanceSecurityGroup
      UserData:
        "Fn::Base64": !Sub |
          #!/bin/bash
          export HOME=/home/ec2-user
      
          # Ensure PM2 is installed
          if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
          fi
      
          # Set proper ownership for PM2 socket files
          if [ -S /home/ec2-user/.pm2/rpc.sock ] && [ -S /home/ec2-user/.pm2/pub.sock ]; then
              sudo chown ec2-user:ec2-user /home/ec2-user/.pm2/rpc.sock /home/ec2-user/.pm2/pub.sock
          fi
      
          # Ensure the script exists and is executable
          if [ ! -f /home/ec2-user/cloud_restart.sh ]; then
              echo "/home/ec2-user/cloud_restart.sh not found."
              exit 1
          fi
      
          chmod +x /home/ec2-user/cloud_restart.sh
          sudo chown ec2-user:ec2-user /home/ec2-user/cloud_restart.sh
      
          # Execute the app restart logic
          /home/ec2-user/cloud_restart.sh
      
          # Save current PM2 process list for future restarts
          pm2 save
      
          # Restart PM2 to ensure saved apps come up on reboot
          pm2 startup systemd -u ec2-user --hp /home/ec2-user
          sudo env PATH=$PATH:/home/ec2-user/.nvm/versions/node/*/bin pm2 startup systemd -u ec2-user --hp /home/ec2-user"


Outputs:
  EC2InstancePublicIP:
    Description: Public IP of the CloudPi EC2 instance
    Value: !GetAtt EC2Instance.PublicIp

  # What setup-lambda.sh asks for (only when EnableLambdaIngestion is 'true')
  LambdaSubnetIds:
    Condition: LambdaEnabled
    Description: --subnets for setup-lambda.sh (two Availability Zones)
    Value: !Join [',', [!Ref Subnet1, !Ref Subnet2]]
  LambdaSecurityGroupId:
    Condition: LambdaEnabled
    Description: --security-group for setup-lambda.sh
    Value: !Ref LambdaSecurityGroup
  InstanceRoleName:
    Condition: LambdaEnabled
    Description: --instance-role for setup-lambda.sh
    Value: !Ref InstanceRole
  DatabaseHost:
    Condition: LambdaEnabled
    Description: The server's private address, for the database URL in the Secrets Manager secret (port 3306)
    Value: !GetAtt EC2Instance.PrivateIp




